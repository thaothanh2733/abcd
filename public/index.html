<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6f7">
  <meta name="description" content="Dán tin nhắn hoặc tải ảnh để kiểm tra dấu hiệu lừa đảo.">
  <title>Lá Chắn Người Thân - Kiểm tra tin nhắn</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="floating-tools" role="group" aria-label="Cài đặt dễ đọc">
    <span class="tools-label">Cỡ chữ</span>
    <button class="glass-control" type="button" data-font-size="normal" aria-label="Cỡ chữ thường" aria-pressed="true">A</button>
    <button class="glass-control" type="button" data-font-size="large" aria-label="Cỡ chữ lớn" aria-pressed="false">A+</button>
    <button class="glass-control" type="button" data-font-size="xlarge" aria-label="Cỡ chữ rất lớn" aria-pressed="false">A++</button>
    <span class="tools-divider" aria-hidden="true"></span>
    <button class="glass-control theme-control" type="button" id="contrastBtn" aria-label="Chuyển sang giao diện tối" title="Chuyển giao diện sáng hoặc tối" aria-pressed="false">
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
      </svg>
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.2 15.4A8.6 8.6 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"></path>
      </svg>
    </button>
  </div>

  <main>
    <section class="checker" id="checker" aria-labelledby="checkerTitle">
      <div class="checker-heading">
        <p class="section-kicker">KIỂM TRA TIN NHẮN</p>
        <h2 id="checkerTitle">Chọn cách kiểm tra</h2>
        <p class="privacy-note">Che mã OTP, mật khẩu và số tài khoản trước khi kiểm tra.</p>
      </div>

      <div class="checker-surface">
        <div class="input-tabs" role="tablist" aria-label="Chọn cách nhập tin nhắn">
          <button class="glass-button tab-btn active" type="button" data-tab="tab-text" role="tab" aria-selected="true">Dán tin nhắn</button>
          <button class="glass-button tab-btn" type="button" data-tab="tab-image" role="tab" aria-selected="false">Tải ảnh chụp</button>
        </div>

        <div class="tab-content">
          <div class="tab-pane active" id="tab-text" role="tabpanel">
            <label for="messageInput">Nội dung tin nhắn</label>
            <textarea id="messageInput" class="message-textarea" placeholder="Dán tin nhắn vào đây..." rows="5"></textarea>
            <div class="textarea-footer">
              <span id="charCount" aria-live="polite">0 ký tự</span>
              <button type="button" class="glass-button secondary-button" id="clearTextBtn">Xóa nội dung</button>
            </div>
          </div>

          <div class="tab-pane" id="tab-image" role="tabpanel">
            <input type="file" id="fileInput" class="file-input" accept="image/png, image/jpeg, image/jpg, image/webp">
            <button type="button" class="glass-button upload-button" id="dropzone">
              <span class="upload-title">Chọn ảnh chụp tin nhắn</span>
              <span class="upload-description">Ảnh PNG, JPG hoặc WEBP · tối đa 10 MB</span>
            </button>
            <div class="image-preview-container" id="previewContainer">
              <div class="image-preview-header">
                <span>Ảnh đã chọn</span>
                <button type="button" class="glass-button secondary-button" id="removeImgBtn">Xóa ảnh</button>
              </div>
              <div class="preview-img-wrapper">
                <img id="previewImg" class="preview-img" alt="Ảnh chụp tin nhắn đã chọn">
              </div>
              <div class="ocr-progress-box" id="ocrProgressBox" role="status" aria-live="polite">
                <div id="ocrProgressText">Đang đọc chữ trong ảnh...</div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="ocrProgressBar"></div></div>
              </div>
              <div class="ocr-result-box" id="ocrResultBox">
                <label for="ocrResultText">Chữ đọc được — Bác có thể sửa nếu chưa đúng</label>
                <textarea id="ocrResultText" class="message-textarea" rows="4" aria-label="Chữ đọc được từ ảnh, có thể chỉnh sửa"></textarea>
              </div>
            </div>
          </div>
        </div>

        <button type="button" id="analyzeBtn" class="glass-button analyze-button">Kiểm tra tin nhắn</button>
      </div>

      <div class="loading-box" id="loadingBox" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <p class="loading-text">Đang kiểm tra tin nhắn...</p>
      </div>

      <section class="result-card" id="resultCard" role="region" aria-label="Kết quả kiểm tra" aria-live="polite">
        <div class="result-banner" id="resultBanner">
          <div class="banner-left">
            <div class="banner-title-wrap">
              <h2>Mức cảnh báo</h2>
              <p class="banner-level-text" id="alertLevelText"></p>
            </div>
          </div>
          <div class="banner-badges">
            <p class="scenario-badge" id="scenarioBadge"></p>
            <p class="engine-badge" id="engineBadge"></p>
          </div>
        </div>

        <div class="result-body">
          <section class="result-section">
            <h3 class="result-heading">Dấu hiệu nhận biết</h3>
            <ul class="detected-list" id="detectedList"></ul>
          </section>
          <section class="result-section">
            <h3 class="result-heading">Vì sao cần cảnh giác?</h3>
            <p class="result-explanation-text" id="explanationText"></p>
          </section>
          <section class="result-section">
            <h3 class="result-heading">Bác nên làm gì?</h3>
            <ul class="actions-list" id="actionsList"></ul>
          </section>
          <p class="safety-reminder-text" id="safetyReminderText"></p>
        </div>

        <div class="result-footer">
          <button type="button" class="glass-button secondary-button" id="ttsBtn">Đọc kết quả</button>
          <button type="button" class="glass-button secondary-button" id="resetBtn">Kiểm tra tin khác</button>
          <button type="button" class="glass-button secondary-button" id="copyBtn">Sao chép kết quả</button>
        </div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
