name: Build Android APK (Tự động đóng gói APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Chấp nhận giấy phép và cài Android SDK 35
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.1" || true

    - name: Phân quyền cho gradlew
      run: chmod +x android/gradlew

    - name: Biên dịch APK và lưu log lỗi
      id: build_step
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace > ../build.log 2>&1
        BUILD_EXIT=$?
        echo "exit_code=$BUILD_EXIT" >> $GITHUB_OUTPUT
        exit $BUILD_EXIT

    - name: Upload build log (kể cả khi lỗi)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 3

    - name: Tìm APK
      if: always()
      run: |
        echo "=== APK files ==="
        find android/app/build -name "*.apk" 2>/dev/null || echo "KHÔNG TÌM THẤY"

    - name: Xuất file APK lên GitHub
      if: steps.build_step.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: LaChanNguoiThan-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error
