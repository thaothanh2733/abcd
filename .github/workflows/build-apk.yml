name: Build Android APK (Tự động đóng gói APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Chấp nhận giấy phép và cài Android SDK 35
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.1" || true

    - name: Phân quyền cho gradlew
      run: chmod +x android/gradlew

    - name: Biên dịch file APK Android
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -100

    - name: Kiểm tra file APK đã tạo chưa
      run: |
        find android/app/build/outputs -name "*.apk" 2>/dev/null && echo "APK OK" || echo "APK NOT FOUND"

    - name: Xuất file APK lên GitHub
      uses: actions/upload-artifact@v4
      with:
        name: LaChanNguoiThan-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
