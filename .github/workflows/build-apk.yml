name: Build Android APK (Tự động đóng gói APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Chấp nhận giấy phép và cài Android SDK 35
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.1" || true

    - name: Phân quyền cho gradlew
      run: chmod +x android/gradlew

    - name: In môi trường Android SDK
      run: |
        echo "JAVA:" && java -version 2>&1
        echo "PLATFORMS:" && ls $ANDROID_HOME/platforms/
        echo "BUILD-TOOLS:" && ls $ANDROID_HOME/build-tools/

    - name: Biên dịch APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log; exit ${PIPESTATUS[0]}

    - name: In 200 dong log cuoi neu that bai
      if: failure()
      run: |
        echo "============ GRADLE BUILD LOG (200 dong cuoi) ============"
        tail -200 /tmp/gradle.log
        echo "============================================================"

    - name: Kiem tra APK
      if: always()
      run: find android/app/build -name "*.apk" 2>/dev/null || echo "KHONG CO APK"

    - name: Xuất file APK lên GitHub
      uses: actions/upload-artifact@v4
      with:
        name: LaChanNguoiThan-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error
