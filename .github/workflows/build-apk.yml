name: Build Android APK (Tự động đóng gói APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Chấp nhận giấy phép và cài Android SDK 35
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.1" || true

    - name: Phân quyền cho gradlew
      run: chmod +x android/gradlew

    - name: Biên dịch file APK Android
      run: |
        set -e
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Tìm file APK vừa tạo
      run: |
        echo "=== Tìm file APK ==="
        find android/app/build -name "*.apk" 2>/dev/null || echo "KHÔNG TÌM THẤY APK"
        ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Thư mục không tồn tại"

    - name: Xuất file APK lên GitHub
      uses: actions/upload-artifact@v4
      with:
        name: LaChanNguoiThan-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error
