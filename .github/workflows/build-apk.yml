name: Build Android APK (Tự động đóng gói APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cài đặt Android SDK
      uses: android-actions/setup-android@v3

    - name: Cấp quyền chạy cho Gradle Wrapper
      run: |
        cd android
        gradle wrapper
        chmod +x gradlew

    - name: Biên dịch file APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: Xuất file APK lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LaChanNguoiThan-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
